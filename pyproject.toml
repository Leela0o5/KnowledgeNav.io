[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knowledge-nav"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "chromadb>=0.5",
    "cohere>=5.0",
    "rank-bm25>=0.2",
    "pydantic-settings>=2.0",
    "anthropic>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis[asyncio]>=5.0",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp>=1.25",
    "langsmith>=0.1",
    "html2text>=2024.2",
    "nltk>=3.8",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "pytest-asyncio", "ruff", "mypy", "respx", "httpx"]
eval = ["ragas", "datasets", "pandas"]

[tool.hatch.build.targets.wheel]
packages = [
    "backend/src",
    "backend/agent",
    "backend/api",
    "backend/auth",
    "backend/citation",
    "backend/evaluation",
    "backend/ingestion",
    "backend/retrieval",
    "backend/sessions",
]

[tool.ruff]
src = ["backend"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "ERA"]
ignore = []

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "backend"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["backend"]

[tool.coverage.run]
source = ["src", "agent", "api", "auth", "citation", "evaluation", "ingestion", "retrieval", "sessions"]
omit = ["*/migrations/*"]
