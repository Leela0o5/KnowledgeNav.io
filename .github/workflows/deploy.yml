name: Deploy

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase owner
        run: echo "OWNER=${OWNER,,}" >> $GITHUB_ENV
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        run: |
          docker build -f Dockerfile.api -t ghcr.io/${{ env.OWNER }}/knowledge-nav-api:${{ github.sha }} .
          docker push ghcr.io/${{ env.OWNER }}/knowledge-nav-api:${{ github.sha }}
